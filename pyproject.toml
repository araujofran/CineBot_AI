[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "cinebot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1","uvicorn>=0.30,<1","pydantic>=2.9,<3","pydantic-settings>=2.5,<3","httpx>=0.27,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
include = ["cinebot*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
"cinebot.presentation" = ["*.html", "assets/*.css", "assets/*.js"]
